name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: make

  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: make test

  coverage:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: make coverage
